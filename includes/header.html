<header class="site-header">
  <div class="header-container">
    <a
      href="/"
      class="site-logo"
      aria-label="Miere de Manuka - Pagina principală">
      <div class="logo-icon" aria-hidden="true">🍯</div>

      <div class="logo-text">
        <span class="logo-title"> Miere de Manuka </span>

        <span class="logo-subtitle"> Originala din Noua Zeelanda</span>

        <span class="logo-description">
          Produse certificate • Ghiduri • Oferte online
        </span>
      </div>
    </a>

    <div class="header-search">
      <label for="searchInput" class="visually-hidden">
        Caută produse sau articole
      </label>

      <input
        type="search"
        id="searchInput"
        class="header-search-input"
        placeholder="Caută produse sau articole Miere de Manuka..."
        autocomplete="off" />

      <button type="button" id="searchButton" class="header-search-button">
        Caută
      </button>
    </div>
  </div>
</header>
